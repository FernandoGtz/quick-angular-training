<form
  [formGroup]="exerciseForm"
  (ngSubmit)="onSubmit()"
  class="max-w-xl mx-auto p-6 bg-gray-900 text-white rounded-2xl shadow-lg space-y-6"
>
  <h2 class="text-2xl font-semibold text-center text-red-500">Registro de Ejercicio</h2>

  <div>
    <label class="block mb-1 text-sm font-medium">Nombre:</label>
    <input type="text" formControlName="description" class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-red-500">
    @if (exerciseForm.get('name')?.hasError('required') && exerciseForm.get('name')?.touched) {
      <span class="text-red-400 text-sm">El nombre es obligatorio</span>
    }
  </div>

  <div>
    <label class="block mb-1 text-sm font-medium">Grupo muscular:</label>
    <input type="text" formControlName="description" class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-red-500">
    @if (exerciseForm.get('targetMuscle')?.hasError('required') && exerciseForm.get('targetMuscle')?.touched) {
      <span class="text-red-400 text-sm">El grupo muscular es obligatorio</span>
    }
  </div>

  <button type="submit" class="w-full py-2 bg-red-600 hover:bg-red-700 transition rounded-lg font-semibold">Guardar Ejercicio</button>
</form>
