<div class="max-w-2xl mx-auto">
  <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8">
    <h2 class="text-xl font-semibold text-slate-800 mb-6">Registro de Ejercicio</h2>
    <form
      [formGroup]="exerciseForm"
      (ngSubmit)="onSubmit()"
      class="space-y-5"
    >
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre:</label>
        <input type="text" formControlName="name" class="w-full px-4 py-2 rounded-lg border border-slate-300 bg-white text-slate-800
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   placeholder:text-slate-400 ">
        @if (exerciseForm.get('name')?.hasError('required') && exerciseForm.get('name')?.touched) {
          <span class="text-red-400 text-sm">El nombre es obligatorio</span>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Grupo muscular:</label>
        <input type="text" formControlName="targetMuscle" class="w-full px-4 py-2 rounded-lg border border-slate-300 bg-white text-slate-800
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   placeholder:text-slate-400 ">
        @if (exerciseForm.get('targetMuscle')?.hasError('required') && exerciseForm.get('targetMuscle')?.touched) {
          <span class="text-red-400 text-sm">El grupo muscular es obligatorio</span>
        }
      </div>

      <button type="submit" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium
                 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500">Guardar Ejercicio</button>
    </form>
  </div>
</div>
