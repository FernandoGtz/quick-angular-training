<div class="max-w-2xl mx-auto">
  <div class="bg-white rounded-xl shadow-md border border-gray-200 p-8">
    <h2 class="text-xl font-semibold text-gray-900 mb-6">Registro de Ejercicio</h2>
    <form
      [formGroup]="exerciseForm"
      (ngSubmit)="onSubmit()"
      class="space-y-5"
    >
      <div>
        <label class="block text-sm font-medium text-gray-500 mb-1">Nombre:</label>
        <input type="text" formControlName="name" class="w-full px-4 py-2 rounded-lg border border-gray-300 bg-white text-gray-900
                   focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500
                   placeholder:text-gray-400 ">
        @if (nameCtrl.hasError('required') && nameCtrl.touched) {
          <span class="text-coral-600 text-sm">El nombre es obligatorio</span>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-500 mb-1">Grupo muscular:</label>
        <input type="text" formControlName="targetMuscle" class="w-full px-4 py-2 rounded-lg border border-gray-300 bg-white text-gray-900
                   focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500
                   placeholder:text-gray-400 ">
        @if (targetMuscleCtrl.hasError('required') && targetMuscleCtrl.touched) {
          <span class="text-coral-600 text-sm">El grupo muscular es obligatorio</span>
        }
      </div>

      <button type="submit" class="w-full py-2.5 px-4 bg-brand-500 hover:bg-brand-600 text-white font-medium flex items-center justify-center gap-2
                 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500">
        <app-icon [icon]="Save" [size]="18" className="block"></app-icon>
        Guardar Ejercicio
      </button>
    </form>
  </div>
</div>
