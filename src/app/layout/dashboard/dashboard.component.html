<div class="flex h-screen bg-gray-100 overflow-hidden">

  <!-- Overlay (mobile only, when the sidebar is open) -->
  @if (isSidebarOpen) {
    <div class="fixed inset-0 z-20 bg-black/50 lg:hidden"
         (click)="closeSidebar()">
    </div>
  }

  <!-- Sidebar -->
  <aside class="fixed inset-y-0 left-0 z-30 w-64 min-h-screen bg-gradient-to-b from-brand-700 via-brand-800 to-brand-950 text-white flex flex-col px-1 py-4 gap-2
                transform transition-transform duration-300 ease-in-out
                lg:relative lg:translate-x-0"
         [class.translate-x-0]="isSidebarOpen"
         [class.-translate-x-full]="!isSidebarOpen">

    <!-- Logo -->
    <div class="flex items-center justify-between px-6 py-4">
      <div class="flex items-center gap-2">
        <img src="/logo.svg" alt="Gym App logo" class="w-16 h-16" />
        <span class="text-white font-semibold text-lg">Gym App</span>
      </div>
      <!-- Close button on mobile -->
      <button type="button" (click)="closeSidebar()"
              class="lg:hidden text-gray-300 hover:text-white transition-colors">
        <i class="ti ti-x text-xl"></i>
      </button>
    </div>

    <nav class="flex-1 p-4 space-y-2">
      <a routerLink="trainings" routerLinkActive="bg-white/10 text-white"
         (click)="closeSidebar()"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">
        <i class="ti ti-barbell text-lg"></i>
        Entrenamientos
      </a>
      <a routerLink="exercises" routerLinkActive="bg-white/10 text-white"
         (click)="closeSidebar()"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">
        <i class="ti ti-dumbbell text-lg"></i>
        Ejercicios
      </a>
      <a routerLink="partners" routerLinkActive="bg-white/10 text-white"
         (click)="closeSidebar()"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">
        <i class="ti ti-users text-lg"></i>
        Socios
      </a>
    </nav>

    <div class="w-full flex items-center justify-center gap-2 px-4 py-2 mt-auto">
      <button type="button" (click)="logout()"
              class="flex items-center gap-3 px-3 py-2 rounded-lg text-coral-300 hover:bg-coral-950 hover:text-coral-200 transition-colors w-full">
        <i class="ti ti-logout text-lg"></i>
        Cerrar sesión
      </button>
    </div>

  </aside>

  <!-- Main content -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- Mobile header with hamburger button -->
    <header class="lg:hidden flex items-center gap-4 bg-white border-b border-gray-200 px-4 py-3">
      <button type="button" (click)="toggleSidebar()"
              class="text-gray-700 hover:text-gray-900 transition-colors">
        <i class="ti ti-menu-2 text-2xl"></i>
      </button>
      <img src="/logo.svg" alt="Gym App logo" class="w-6 h-6" />
      <span class="font-semibold text-gray-900">Gym App</span>
    </header>

    <!-- Header with title and filter bar (always visible) -->
    <div class="bg-white border-b border-gray-200 px-6 pt-6 pb-0">
      <h1 class="text-xl lg:text-2xl font-semibold text-gray-900 mb-4">
        Sistema de Administración de Entrenamientos
      </h1>
      <app-filter-bar />
    </div>

    <!-- Router content -->
    <main class="flex-1 p-4 lg:p-6 overflow-auto">
      <router-outlet />
    </main>

  </div>

</div>
