@if (toastService.state$ | async; as toast) {
  @if (toast.show) {
    <!-- Floating container in the top right corner -->
    <div class="fixed top-4 right-4 z-50 flex items-center p-4 mb-4 text-sm text-accent-800 border border-accent-300 rounded-lg bg-accent-50">
      <app-icon [icon]="CircleCheck" [size]="16" className="flex-shrink-0 inline me-3 text-accent-500"></app-icon>
      <span class="font-medium">Operación realizada: </span> {{ toast.message }}
    </div>
  }
}
